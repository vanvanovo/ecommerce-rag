# ========== MySQL ==========
[mysql]
host = 127.0.0.1
port = 3308
user = root
password = 123456
database = ecommerce_qa

# ========== Redis ==========
[redis]
host = 127.0.0.1
port = 6379
password = 123456
db = 0

# ========== Milvus ==========
[milvus]
host = 127.0.0.1
port = 19530
# 注意：这个 database 需要在 Milvus 里先手动创建
database_name = ecom
collection_name = ecom_rag

# ========== LLM ==========
[llm]
model = qwen-plus
dashscope_api_key = sk-xxxx
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# ========== 模型设备 ==========
[model]
# auto = 有 CUDA 用 GPU，否则 CPU；也可写死 cpu / cuda / mps
device = auto

# ========== 检索参数 ==========
[retrieval]
parent_chunk_size = 1000
child_chunk_size = 200
parent_chunk_overlap = 150
child_chunk_overlap = 30
retrieval_k = 10
candidate_m = 2
bm25_threshold = 0.85

# ========== 应用 ==========
[app]
# 电商品类/文档来源，用于 source_filter 过滤
valid_sources = ["手机", "电脑", "平板", "售后政策", "操作指南"]
customer_service_phone = 400-000-0000